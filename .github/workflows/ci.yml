name: CI/CD

on:
  push:
    branches: ['**']          # semua branch: test backend dan build frontend selalu jalan
  pull_request:
    branches: [main, dev]     # check wajib sebelum merge ke main dan dev

permissions:
  contents: read

jobs:
  backend:
    name: Backend Test        # nama ini dipakai sebagai required status check, jangan diganti
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup PHP 8.2
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, pdo_sqlite, sqlite3
          coverage: none
          tools: composer:v2

      - name: Cache vendor Composer
        uses: actions/cache@v4
        with:
          path: backend/vendor
          key: composer-${{ runner.os }}-${{ hashFiles('backend/composer.lock') }}

      - name: Pasang dependency Composer
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Siapkan .env untuk testing
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Periksa gaya kode (Laravel Pint)
        run: vendor/bin/pint --test

      - name: Jalankan test (php artisan test)
        run: php artisan test

  frontend:
    name: Frontend Test       # nama ini dipakai sebagai required status check, jangan diganti
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Node.js 24
        uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Pasang dependency (npm ci)
        run: npm ci

      - name: Periksa gaya kode (oxlint + ESLint)
        run: npm run lint

      - name: Jalankan unit test (Vitest)
        run: npm run test:unit -- --run

      - name: Build aplikasi Vue (npm run build)
        run: npm run build
        env:
          VITE_API_URL: ${{ vars.VITE_API_URL || '/api' }}

      - name: Unggah hasil build sebagai artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist
          retention-days: 3
