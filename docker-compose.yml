# ===========================================================================
# To-Do List: MySQL + backend Laravel (FrankenPHP) + frontend Vue (Nginx)
#
#   Browser ──:8080──► frontend ──/api──► backend:8000 ──► db:3306
#
# Jalankan seluruh sistem dengan satu perintah:  docker compose up -d --build
# Konfigurasi dibaca dari berkas .env di folder ini (salin dari .env.example).
# Ketiga service berada di satu network dan saling menemukan lewat NAMA SERVICE:
# backend memanggil host "db", Nginx di frontend meneruskan /api ke "backend".
# ===========================================================================
name: uts-pl-todo

# ---------------------------------------------------------------------------
# Batas ukuran log container. Driver json-file bawaan Docker tidak punya batas,
# sehingga log bisa terus membesar sampai disk penuh. Dengan pengaturan ini tiap
# container menyimpan paling banyak 3 berkas x 10 MB; berkas tertua dibuang
# otomatis (rotasi). Dipakai semua service lewat `logging: *logging-terbatas`.
# ---------------------------------------------------------------------------
x-logging: &logging-terbatas
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  # -------------------------------------------------------------------------
  # Basis data MySQL. Port 3306 sengaja tidak dibuka ke laptop: hanya service
  # lain di network todo-net yang boleh terhubung.
  # -------------------------------------------------------------------------
  db:
    image: mysql:8.4.11
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:?DB_DATABASE wajib diisi di .env}
      MYSQL_USER: ${DB_USERNAME:?DB_USERNAME wajib diisi di .env}
      MYSQL_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD wajib diisi di .env}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?DB_ROOT_PASSWORD wajib diisi di .env}
    volumes:
      - db-data:/var/lib/mysql
    networks:
      - todo-net
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u root -p\"$$MYSQL_ROOT_PASSWORD\" --silent"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 30s
    logging: *logging-terbatas

  # -------------------------------------------------------------------------
  # Backend Laravel 12 dilayani FrankenPHP. Dibangun dari backend/Dockerfile.
  # -------------------------------------------------------------------------
  backend:
    build:
      context: ./backend
      labels: &label-image
        # Menautkan image di GitHub Container Registry ke repository ini.
        org.opencontainers.image.source: https://github.com/pbsatr25/uts-pl-24-534908-SV-24108
        org.opencontainers.image.revision: ${IMAGE_REVISION:-local}
    image: ${BACKEND_IMAGE:-uts-pl-backend}:${IMAGE_TAG:-local}
    restart: unless-stopped
    environment:
      APP_NAME: "To-Do List"
      APP_KEY: ${APP_KEY:?APP_KEY wajib diisi di .env}
      APP_URL: http://localhost:${FRONTEND_PORT:-8080}
      DB_CONNECTION: mysql
      DB_HOST: db
      DB_PORT: 3306
      DB_DATABASE: ${DB_DATABASE}
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_TIMEOUT: 3                      # detik; saat MySQL mati, request gagal cepat
      # Log Laravel ke stdout (JSON satu baris per kejadian), bukan berkas di container.
      LOG_CHANNEL: stdout
      LOG_LEVEL: info
      # Cache berkas di dalam container, terpisah dari MySQL, sehingga /health bisa
      # menunjukkan bagian mana yang bermasalah (database atau cache).
      CACHE_STORE: file
      # Metrik HTTP bawaan Caddy (jumlah permintaan per status) untuk Prometheus,
      # disajikan di port 9180 yang TIDAK dibuka ke laptop (hanya network Compose).
      CADDY_GLOBAL_OPTIONS: "admin off\nmetrics"
      CADDY_EXTRA_CONFIG: ":9180 {\n\tmetrics /metrics\n}"
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    networks:
      - todo-net
    # Saat container db mati, nama "db" hilang dari DNS internal Docker dan pencariannya
    # diteruskan ke DNS luar yang lambat (~15 detik). Batas 1 detik membuat koneksi dan
    # /health langsung gagal dengan sebab yang jelas, bukan menggantung sampai timeout.
    dns_opt:
      - timeout:1
      - attempts:1
    # /health memeriksa basis data dan cache; membalas 503 (wget gagal) bila ada
    # yang bermasalah. 3 kali gagal berturut-turut (~30 detik) = unhealthy.
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:8000/health"]
      interval: 10s
      timeout: 8s
      retries: 3
      start_period: 40s
    logging: *logging-terbatas

  # -------------------------------------------------------------------------
  # Frontend Vue 3 hasil build, dilayani Nginx. Dibangun dari frontend/Dockerfile.
  # -------------------------------------------------------------------------
  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: ${VITE_API_URL:-/api}
      labels: *label-image
    image: ${FRONTEND_IMAGE:-uts-pl-frontend}:${IMAGE_TAG:-local}
    restart: unless-stopped
    environment:
      API_UPSTREAM: http://backend:8000
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "${FRONTEND_PORT:-8080}:8080"
    networks:
      - todo-net
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:8080/healthz"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 10s
    logging: *logging-terbatas

  # =========================================================================
  # Monitoring: Prometheus mengumpulkan angka, Grafana menggambarnya.
  # Versi image dikunci (bukan latest). Port Prometheus dan Grafana hanya
  # dibuka ke 127.0.0.1, jadi tidak bisa dijangkau dari komputer lain.
  # =========================================================================
  prometheus:
    image: prom/prometheus:v2.53.0
    restart: unless-stopped
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./monitoring/alerts.yml:/etc/prometheus/alerts.yml:ro
      - prom-data:/prometheus            # riwayat metrik tidak hilang saat container diganti
    ports:
      - "127.0.0.1:9090:9090"
    networks:
      - todo-net
    logging: *logging-terbatas

  grafana:
    image: grafana/grafana:11.1.0
    restart: unless-stopped
    environment:
      # Password admin dari .env (tidak di-commit), bukan admin/admin bawaan.
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?GRAFANA_ADMIN_PASSWORD wajib diisi di .env}
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - grafana-data:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      - prometheus
    networks:
      - todo-net
    logging: *logging-terbatas

  # CPU dan memori tiap container, dibaca dari cgroup lewat folder host (read-only).
  cadvisor:
    # v0.57.0, bukan v0.49.1 dari modul: v0.49.1 memakai Docker API 1.41 yang ditolak
    # Docker 29 (minimal 1.44), sehingga cAdvisor tidak tahu nama container.
    image: ghcr.io/google/cadvisor:v0.57.0
    restart: unless-stopped
    privileged: true
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
    networks:
      - todo-net
    logging: *logging-terbatas

  # CPU, memori, dan disk mesin yang menjalankan Docker.
  node-exporter:
    image: prom/node-exporter:v1.8.1
    restart: unless-stopped
    networks:
      - todo-net
    logging: *logging-terbatas

networks:
  todo-net:

volumes:
  db-data:
  prom-data:
  grafana-data:
